<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="40%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f2b48" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="600" fill="url(#skyGrad)" />

  <!-- Modern Hospital Architectural Silhouette -->
  <g opacity="0.85">
    <!-- Main Hospital Tower -->
    <rect x="240" y="140" width="320" height="460" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <!-- Tower Windows Grid -->
    <g fill="#38bdf8" opacity="0.25">
      <rect x="270" y="170" width="30" height="20" rx="2" />
      <rect x="315" y="170" width="30" height="20" rx="2" />
      <rect x="360" y="170" width="30" height="20" rx="2" fill="#38bdf8" opacity="0.8" />
      <rect x="405" y="170" width="30" height="20" rx="2" />
      <rect x="450" y="170" width="30" height="20" rx="2" />
      <rect x="495" y="170" width="30" height="20" rx="2" />

      <rect x="270" y="210" width="30" height="20" rx="2" />
      <rect x="315" y="210" width="30" height="20" rx="2" fill="#38bdf8" opacity="0.9" />
      <rect x="360" y="210" width="30" height="20" rx="2" />
      <rect x="405" y="210" width="30" height="20" rx="2" />
      <rect x="450" y="210" width="30" height="20" rx="2" fill="#38bdf8" opacity="0.7" />
      <rect x="495" y="210" width="30" height="20" rx="2" />

      <rect x="270" y="250" width="30" height="20" rx="2" />
      <rect x="315" y="250" width="30" height="20" rx="2" />
      <rect x="360" y="250" width="30" height="20" rx="2" />
      <rect x="405" y="250" width="30" height="20" rx="2" fill="#38bdf8" opacity="0.85" />
      <rect x="450" y="250" width="30" height="20" rx="2" />
      <rect x="495" y="250" width="30" height="20" rx="2" />

      <rect x="270" y="290" width="30" height="20" rx="2" fill="#38bdf8" opacity="0.8" />
      <rect x="315" y="290" width="30" height="20" rx="2" />
      <rect x="360" y="290" width="30" height="20" rx="2" />
      <rect x="405" y="290" width="30" height="20" rx="2" />
      <rect x="450" y="290" width="30" height="20" rx="2" />
      <rect x="495" y="290" width="30" height="20" rx="2" fill="#38bdf8" opacity="0.75" />
    </g>

    <!-- Emergency / Trauma Wing -->
    <rect x="120" y="240" width="160" height="360" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    <!-- Diagnostic Center Wing -->
    <rect x="520" y="210" width="180" height="390" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />

    <!-- Hospital Red Cross / Emblem on Building -->
    <circle cx="400" cy="90" r="28" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <path d="M400 76 L400 104 M386 90 L414 90" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Clean Ground & Walkway -->
  <rect x="0" y="520" width="800" height="80" fill="#0b1120" />
  <line x1="0" y1="520" x2="800" y2="520" stroke="#1e293b" stroke-width="2" />

  <!-- Subtle Ambient Glow -->
  <circle cx="400" cy="180" r="160" fill="#0284c7" opacity="0.08" />
</svg>
